<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sheeping Games – API Status</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      color: #e0e0f0;
      padding: 2rem;
    }

    /* Subtle animated background blobs */
    body::before, body::after {
      content: '';
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.25;
      z-index: 0;
      animation: float 10s ease-in-out infinite alternate;
    }
    body::before {
      width: 400px; height: 400px;
      background: #7b2ff7;
      top: -100px; left: -100px;
    }
    body::after {
      width: 350px; height: 350px;
      background: #00d2ff;
      bottom: -80px; right: -80px;
      animation-delay: -5s;
    }
    @keyframes float {
      from { transform: translate(0, 0) scale(1); }
      to   { transform: translate(40px, 40px) scale(1.1); }
    }

    /* Card */
    .card {
      position: relative;
      z-index: 1;
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 24px;
      padding: 2.5rem 3rem;
      max-width: 520px;
      width: 100%;
      text-align: center;
      box-shadow: 0 8px 40px rgba(0, 0, 0, 0.4);
    }

    .logo {
      font-size: 2.8rem;
      margin-bottom: 0.25rem;
    }

    h1 {
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: #ffffff;
    }

    .subtitle {
      font-size: 0.9rem;
      color: #a0a0c0;
      margin-top: 0.25rem;
      margin-bottom: 2rem;
    }

    /* Status badge */
    .status-wrapper {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      margin-bottom: 1.5rem;
    }

    .pulse-ring {
      position: relative;
      width: 18px;
      height: 18px;
      flex-shrink: 0;
    }
    .pulse-ring span {
      display: block;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: #888;
      transition: background 0.4s;
    }
    .pulse-ring::before {
      content: '';
      position: absolute;
      inset: -4px;
      border-radius: 50%;
      border: 2px solid transparent;
      animation: pulse-anim 1.8s ease-out infinite;
      opacity: 0;
    }

    @keyframes pulse-anim {
      0%   { transform: scale(0.8); opacity: 0.6; }
      100% { transform: scale(1.8); opacity: 0; }
    }

    /* State colours */
    .state-up    .pulse-ring span       { background: #22d47a; }
    .state-up    .pulse-ring::before    { border-color: #22d47a; }
    .state-down  .pulse-ring span       { background: #ff4d6a; }
    .state-down  .pulse-ring::before    { border-color: #ff4d6a; }
    .state-checking .pulse-ring span    { background: #f0b429; }
    .state-checking .pulse-ring::before { border-color: #f0b429; }

    .status-text {
      font-size: 1.1rem;
      font-weight: 600;
    }
    .state-up    .status-text { color: #22d47a; }
    .state-down  .status-text { color: #ff4d6a; }
    .state-checking .status-text { color: #f0b429; }

    /* Detail row */
    .detail-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 12px;
      padding: 0.65rem 1rem;
      margin-bottom: 0.6rem;
      font-size: 0.85rem;
    }
    .detail-row .label { color: #9090b0; }
    .detail-row .value { color: #e0e0f0; font-weight: 500; }

    /* Refresh button */
    .btn-refresh {
      margin-top: 1.5rem;
      padding: 0.6rem 1.8rem;
      border: none;
      border-radius: 50px;
      background: linear-gradient(90deg, #7b2ff7, #00d2ff);
      color: #fff;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
    }
    .btn-refresh:hover  { opacity: 0.85; }
    .btn-refresh:active { transform: scale(0.97); }
    .btn-refresh:disabled { opacity: 0.5; cursor: not-allowed; }

    /* Countdown */
    .countdown {
      margin-top: 1rem;
      font-size: 0.78rem;
      color: #6060a0;
    }

    footer {
      position: relative;
      z-index: 1;
      margin-top: 2rem;
      font-size: 0.75rem;
      color: #50507a;
    }
  </style>
</head>
<body>
  <div class="card state-checking" id="card">
    <div class="logo">🐑</div>
    <h1>Sheeping Games</h1>
    <p class="subtitle">API Liveness Monitor</p>

    <div class="status-wrapper">
      <div class="pulse-ring"><span></span></div>
      <span class="status-text" id="statusText">Checking…</span>
    </div>

    <div class="detail-row">
      <span class="label">Endpoint</span>
      <span class="value" id="endpointLabel">api.sheeping.games</span>
    </div>
    <div class="detail-row">
      <span class="label">Response time</span>
      <span class="value" id="responseTime">—</span>
    </div>
    <div class="detail-row">
      <span class="label">Last checked</span>
      <span class="value" id="lastChecked">—</span>
    </div>
    <div class="detail-row">
      <span class="label">HTTP status</span>
      <span class="value" id="httpStatus">—</span>
    </div>

    <button class="btn-refresh" id="refreshBtn" onclick="runCheck()">Refresh</button>
    <p class="countdown" id="countdown"></p>
  </div>

  <footer>sheeping.games &nbsp;·&nbsp; status page</footer>

  <script>
    const ENDPOINT = 'https://api.sheeping.games';
    const AUTO_REFRESH_SECONDS = 30;

    const card         = document.getElementById('card');
    const statusText   = document.getElementById('statusText');
    const responseTime = document.getElementById('responseTime');
    const lastChecked  = document.getElementById('lastChecked');
    const httpStatus   = document.getElementById('httpStatus');
    const refreshBtn   = document.getElementById('refreshBtn');
    const countdown    = document.getElementById('countdown');

    let countdownTimer = null;
    let secondsLeft    = AUTO_REFRESH_SECONDS;

    function setState(state, text) {
      card.className = `card state-${state}`;
      statusText.textContent = text;
    }

    function startCountdown() {
      clearInterval(countdownTimer);
      secondsLeft = AUTO_REFRESH_SECONDS;
      countdown.textContent = `Auto-refresh in ${secondsLeft}s`;
      countdownTimer = setInterval(() => {
        secondsLeft--;
        if (secondsLeft <= 0) {
          clearInterval(countdownTimer);
          countdown.textContent = '';
          runCheck();
        } else {
          countdown.textContent = `Auto-refresh in ${secondsLeft}s`;
        }
      }, 1000);
    }

    async function runCheck() {
      refreshBtn.disabled = true;
      clearInterval(countdownTimer);
      countdown.textContent = '';
      setState('checking', 'Checking…');
      responseTime.textContent = '—';
      httpStatus.textContent   = '—';

      const start = performance.now();
      try {
        const res = await fetch(ENDPOINT, { method: 'GET', mode: 'no-cors', cache: 'no-store' });
        const elapsed = Math.round(performance.now() - start);
        // With no-cors the response type is 'opaque'; a response object means the
        // host is reachable, even though we cannot read status/headers due to CORS.
        // When CORS allows the response, verify it is a 2xx success code.
        const isOpaque = res.type === 'opaque';
        const isSuccess = isOpaque || (res.status >= 200 && res.status < 300);
        const code = isOpaque ? 'Reachable (CORS restricted)' : String(res.status);

        if (isSuccess) {
          setState('up', 'Operational');
        } else {
          setState('down', `Error ${res.status}`);
        }
        responseTime.textContent = `${elapsed} ms`;
        httpStatus.textContent   = code;
      } catch (err) {
        const elapsed = Math.round(performance.now() - start);
        setState('down', 'Unreachable');
        responseTime.textContent = `${elapsed} ms`;
        httpStatus.textContent   = 'Error';
      } finally {
        lastChecked.textContent = new Date().toLocaleTimeString();
        refreshBtn.disabled = false;
        startCountdown();
      }
    }

    // Kick off immediately on page load
    runCheck();
  </script>
</body>
</html>
